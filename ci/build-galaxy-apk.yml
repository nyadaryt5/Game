name: Build Galaxy Sandbox APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a058fd-game
    paths:
      - 'GalaxySandbox/**'
      - '.github/workflows/build-galaxy-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The game lives on the session branch; check that out explicitly so the
      # workflow also works when it is dispatched from main.
      - uses: actions/checkout@v4
        with:
          ref: arena/01a058fd-game

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: GalaxySandbox
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-sandbox-apk
          path: GalaxySandbox/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
