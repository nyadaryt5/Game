name: Android quality and Play bundle

on:
  push:
    branches: [arena/01a0221d-game]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint and build
        working-directory: android
        run: gradle lintDebug assembleDebug bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: sect-master-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sect-master-play-bundle-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
