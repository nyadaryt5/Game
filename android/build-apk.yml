# ─────────────────────────────────────────────────────────────
#  GitHub Actions workflow — builds the Android release APK.
#
#  NOTE: this file is kept OUTSIDE `.github/workflows/` because it is
#  published to the repo by an automation token without `workflows`
#  permission. To enable automatic APK builds, copy this file to:
#
#      .github/workflows/build-apk.yml
#
#  (or create it there from your own account, then push).
# ─────────────────────────────────────────────────────────────
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a021d3-game
    paths:
      - 'android/**'
      - 'index.html'
      - 'styles.css'
      - 'js/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync game into Android assets
        run: bash scripts/sync-android.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sect-master-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
