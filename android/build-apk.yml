# ─────────────────────────────────────────────────────────────
#  GitHub Actions workflow — builds the Android release APK.
#
#  This file is kept here (outside .github/workflows/) only because it is
#  published to the repo by an automation token that GitHub refuses for
#  workflow files. To enable APK builds, copy this file to:
#
#      .github/workflows/build-apk.yml
#
#  The workflow lives on the DEFAULT branch but always checks out the
#  arena/01a021d3-game branch (where the android/ project lives).
# ─────────────────────────────────────────────────────────────
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a021d3-game

      - name: Sync game into Android assets
        run: bash scripts/sync-android.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle assembleRelease
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: sect-master-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
