plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sectmaster.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.sectmaster.game"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        // Reuse the auto-generated debug keystore so the release APK is directly
        // installable on a device. Replace with your own keystore for production.
        release {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // No third-party libraries — pure Android WebView wrapper around the HTML5 game.
}
