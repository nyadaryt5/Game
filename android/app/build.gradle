plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sectmaster.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sectmaster.game'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }

    // Play release signing is enabled only when all four signing values are supplied.
    // Keep credentials in ~/.gradle/gradle.properties or CI secrets, never in Git.
    def releaseStore = providers.gradleProperty('RELEASE_STORE_FILE').orNull
    def releaseStorePassword = providers.gradleProperty('RELEASE_STORE_PASSWORD').orNull
    def releaseKeyAlias = providers.gradleProperty('RELEASE_KEY_ALIAS').orNull
    def releaseKeyPassword = providers.gradleProperty('RELEASE_KEY_PASSWORD').orNull

    signingConfigs {
        if (releaseStore && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            if (signingConfigs.findByName('release') != null) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    // Intentionally dependency-free: Android framework APIs only.
}
