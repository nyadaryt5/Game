plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sectmaster.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.sectmaster.game"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sign with the auto-generated debug key so the release APK installs
            // out of the box. Replace with your own keystore for production.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // No third-party libraries — pure Android WebView wrapper around the HTML5 game.
}
